<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mathe_ai — The Blank</title>
<style>
@font-face{font-family:G;src:url(data:font/woff2;base64,__FONT_B64__) format('woff2');font-weight:100 900;}
html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#0B0B0C}
canvas{display:block}
</style>

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
/* THE BLANK — a 15 s loop for mathe_ai.
   Everything is a pure function of time: window.seek(t) redraws the frame from scratch.
   Motion blur: each seek() averages K samples across a 1/360 s shutter slice. */
const DATA = /*__GLYPHS__*/null;

const W = 1920, H = 1080, CX = 960, DUR = 15;
const INK = '#0B0B0C', PAPER = '#F2EFE8', VER = '#FF4B1F', COB = '#2E4BFF';

/* ---------- easing (all functions of time, no state) ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const P = (t, t0, d) => clamp((t - t0) / d);
const eo = (u, k = 7) => u <= 0 ? 0 : u >= 1 ? 1 : (1 - Math.exp(-k * u)) / (1 - Math.exp(-k));
const ei = (u, k = 7) => 1 - eo(1 - u, k);
const eio = (u, k = 8) => u < .5 ? ei(2 * u, k) / 2 : .5 + eo(2 * u - 1, k) / 2;
/* critically damped spring 0 -> 1 (no overshoot) */
const spr = (t, t0, w = 18) => { const x = t - t0; return x <= 0 ? 0 : 1 - (1 + w * x) * Math.exp(-w * x); };
/* camera whip: double-exponential velocity peaking on the beat */
const WA = .035, WB = .075;
const whip = x => x < 0 ? WA * Math.exp(x / WA) / (WA + WB) : (WA + WB * (1 - Math.exp(-x / WB))) / (WA + WB);

/* ---------- glyphs & title geometry ---------- */
const G = DATA.glyphs, TT = DATA.title;
const FS = 232, TS = FS / 1000;
let bx0 = 1e9, bx1 = -1e9, by0 = 1e9, by1 = -1e9;
TT.chars.forEach((ch, i) => { const b = G[ch].bb;
  bx0 = Math.min(bx0, TT.xs[i] + b[0]); bx1 = Math.max(bx1, TT.xs[i] + b[2]);
  by0 = Math.min(by0, b[1]); by1 = Math.max(by1, b[3]); });
const TX = CX - (bx0 + bx1) / 2 * TS;
const BY = 548 - (by0 + by1) / 2 * TS;
const UB = G['_'].bb;
const LY = Math.round(BY + (UB[1] + UB[3]) / 2 * TS);
const UT = (UB[3] - UB[1]) * TS;
const LT = 6, LTOP = LY - LT / 2, LBOT = LY + LT / 2;
const titleX = i => TX + TT.xs[i] * TS;

function gPath(ch, x, y, s, p = new Path2D()) {
  for (const c of G[ch].c) {
    p.moveTo(x + c[0] * s, y + c[1] * s);
    for (let i = 2; i < c.length; i += 2) p.lineTo(x + c[i] * s, y + c[i + 1] * s);
    p.closePath();
  }
  return p;
}

/* ---------- contour morphing ---------- */
function resample(c, N) {
  const n = c.length / 2, L = [0]; let tot = 0;
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; tot += Math.hypot(c[2*j] - c[2*i], c[2*j+1] - c[2*i+1]); L.push(tot); }
  const o = new Float64Array(2 * N); let s = 0;
  for (let k = 0; k < N; k++) {
    const d = k * tot / N; while (L[s + 1] < d) s++;
    const j = (s + 1) % n, u = (d - L[s]) / ((L[s + 1] - L[s]) || 1);
    o[2*k] = lerp(c[2*s], c[2*j], u); o[2*k+1] = lerp(c[2*s+1], c[2*j+1], u);
  }
  return o;
}
function area(c) { let a = 0; const n = c.length / 2;
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; a += c[2*i] * c[2*j+1] - c[2*j] * c[2*i+1]; } return a / 2; }
function centroid(c) { let x = 0, y = 0; const n = c.length / 2; for (let i = 0; i < n; i++) { x += c[2*i]; y += c[2*i+1]; } return [x / n, y / n]; }
function reversed(c) { const n = c.length / 2, o = new Float64Array(c.length);
  for (let i = 0; i < n; i++) { o[2*i] = c[2*(n-1-i)]; o[2*i+1] = c[2*(n-1-i)+1]; } return o; }
function normer(cs) {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const c of cs) for (let i = 0; i < c.length; i += 2) { x0 = Math.min(x0, c[i]); x1 = Math.max(x1, c[i]); y0 = Math.min(y0, c[i+1]); y1 = Math.max(y1, c[i+1]); }
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, s = Math.max(x1 - x0, y1 - y0) || 1;
  return { fwd: p => [(p[0] - mx) / s, (p[1] - my) / s], inv: p => [p[0] * s + mx, p[1] * s + my],
           arr: c => c.map((v, i) => i % 2 ? (v - my) / s : (v - mx) / s) };
}
/* pair contours of A (source) with B (target), resample, align orientation + start point */
function prepMorph(A, B, opt = {}) {
  const N = opt.N || 360;
  const key = opt.order === 'y' ? (c => centroid(c)[1]) : (c => -Math.abs(area(c)));
  const As = [...A].sort((p, q) => key(p) - key(q)), Bs = [...B].sort((p, q) => key(p) - key(q));
  const na = normer(A), nb = normer(B), pairs = [];
  for (let k = 0; k < Math.max(As.length, Bs.length); k++) {
    let a = As[k] ? resample(As[k], N) : null, b = Bs[k] ? resample(Bs[k], N) : null;
    if (!a) { const p = na.inv(nb.fwd(centroid(b))); a = new Float64Array(2 * N).map((_, i) => p[i % 2]); }
    else if (!b) { const p = nb.inv(na.fwd(centroid(a))); b = new Float64Array(2 * N).map((_, i) => p[i % 2]); }
    else {
      if (Math.sign(area(a)) !== Math.sign(area(b))) a = reversed(a);
      const an = na.arr(a), bn = nb.arr(b); let best = 0, bd = Infinity;
      for (let s = 0; s < N; s++) { let d = 0;
        for (let i = 0; i < N && d < bd; i++) { const j = (i + s) % N; const dx = an[2*i] - bn[2*j], dy = an[2*i+1] - bn[2*j+1]; d += dx*dx + dy*dy; }
        if (d < bd) { bd = d; best = s; } }
      const sh = new Float64Array(2 * N);
      for (let i = 0; i < N; i++) { const j = (i + best) % N; sh[2*i] = b[2*j]; sh[2*i+1] = b[2*j+1]; }
      b = sh;
    }
    pairs.push({ a, b });
  }
  return pairs;
}
/* ta / tb = [scale, tx, ty] affine for source / target local coords */
function morphPath(M, u, ta, tb, p = new Path2D()) {
  for (const { a, b } of M) {
    for (let i = 0; i < a.length; i += 2) {
      const x = lerp(ta[1] + a[i] * ta[0], tb[1] + b[i] * tb[0], u);
      const y = lerp(ta[2] + a[i+1] * ta[0], tb[2] + b[i+1] * tb[0], u);
      i ? p.lineTo(x, y) : p.moveTo(x, y);
    }
    p.closePath();
  }
  return p;
}
function circ(cx, cy, r, n = 240) { const o = new Float64Array(2 * n);
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; o[2*i] = cx + r * Math.cos(a); o[2*i+1] = cy + r * Math.sin(a); } return o; }
function poly(pts) { return Float64Array.from(pts.flat()); }

/* ---------- camera ---------- */
const D = 1500, WHIPS = [2, 4, 6, 12];
const RS = 185;                       // shape radius in bar 3
const SH_T = [4.5, 5.0, 5.5], SH_DPHI = [Math.PI * 2 / 3, Math.PI * 2 / 5, Math.PI / 2];
const phi3 = t => SH_T.reduce((s, T, k) => s + SH_DPHI[k] * eo(P(t, T, .42), 5), 0);
function cam(t) {
  let x = 70 * t + 1.1 * RS * phi3(t);
  for (const T of WHIPS) x += D * whip(t - T);
  return x;
}
const camNoWhip = (t, T) => cam(t) - D * whip(t - T);

/* ---------- bar 1: ring + ruler ---------- */
const RR = 140, RW = 12, RC = RR - RW / 2;   // rolling radius, stroke width, stroke centre radius
const TICK = RR / 2;                          // ruler: 4 minor ticks per diameter
const RX0 = 470;                              // contact x (screen) when the roll starts at t=1
const XR0 = RX0 + cam(1.0);                   // ruler origin in world x
const XE = XR0 + 2 * Math.PI * RR;            // unrolled circumference end
const ringTheta = t => 2 * Math.PI * eio(P(t, 1.0, .48), 6);
const ringWorldX = t => XR0 + RR * ringTheta(t);
const RY = LTOP - RR;

/* ---------- bar 2: Euler identity layout ---------- */
const FS2 = 250, BY2 = LY - 52, SUP = .56, SUPY = BY2 - .40 * FS2;
const EQ = [
  { ch: 'e', s: 1, g: .02, T: 2.0 }, { ch: 'i', s: SUP, g: 0, T: 2.5 }, { ch: 'π', s: SUP, g: .2, T: 2.5 },
  { ch: '+', s: 1, g: .1, T: 3.0 }, { ch: '1', s: 1, g: .16, T: 3.25 }, { ch: '=', s: 1, g: .1, T: 3.5 },
  { ch: '0', s: 1, g: 0, T: 3.75 } ];
const STAGES = [2.0, 2.5, 3.0, 3.25, 3.5, 3.75];
const eqW = i => G[EQ[i].ch].adv * EQ[i].s * FS2 / 1000;
const SL = STAGES.map(T => {
  let x = 0, last = 0; const xs = [];
  EQ.forEach((it, i) => { if (it.T <= T + 1e-6) { xs[i] = x; x += eqW(i) + it.g * FS2; last = i; } });
  const w = x - EQ[last].g * FS2, off = CX - w / 2;
  return xs.map(v => v + off);
});
function eqX(i, t) { const k0 = STAGES.indexOf(EQ[i].T); let x = SL[k0][i];
  for (let k = k0 + 1; k < STAGES.length; k++) x += (SL[k][i] - SL[k-1][i]) * spr(t, STAGES[k], 17);
  return x; }

/* ---------- bar 3: radial shapes ---------- */
const NS = 360;
function radialPoly(verts) {        // verts: [[angle, r]] -> r(theta_i)
  const V = verts.map(([a, r]) => [Math.cos(a) * r, Math.sin(a) * r]), out = new Float64Array(NS);
  for (let i = 0; i < NS; i++) {
    const th = i / NS * Math.PI * 2, dx = Math.cos(th), dy = Math.sin(th); let best = Infinity;
    for (let k = 0; k < V.length; k++) {
      const [x1, y1] = V[k], [x2, y2] = V[(k + 1) % V.length], ex = x2 - x1, ey = y2 - y1;
      const den = dx * ey - dy * ex; if (Math.abs(den) < 1e-9) continue;
      const s = (x1 * ey - y1 * ex) / den, u = (x1 * dy - y1 * dx) / den;
      if (s > 0 && u >= -1e-9 && u <= 1 + 1e-9) best = Math.min(best, s);
    }
    out[i] = best;
  }
  return out;
}
const deg = Math.PI / 180;
const SHAPES = [
  new Float64Array(NS).fill(1),
  radialPoly([-90, 30, 150].map(a => [a * deg, 1.34])),
  radialPoly([...Array(10)].map((_, k) => [(-90 + 36 * k) * deg, k % 2 ? .6 : 1.45])),
  radialPoly([45, 135, 225, 315].map(a => [a * deg, 1.26])),
];

/* ---------- bar 5: data ---------- */
const VALS = [.42, .78, .30, .92, .55, .18, .66, .85, .25, .60, .98, .48, .72, .12, .38, .88];
const NB = VALS.length, BSP = 80, BW_ = 46;
const BX = VALS.map((_, k) => CX + (k - (NB - 1) / 2) * BSP);
const BH = VALS.map(v => 40 + 330 * v);
const RANK = (() => { const idx = VALS.map((v, i) => i).sort((a, b) => VALS[a] - VALS[b]); const r = []; idx.forEach((k, j) => r[k] = j); return r; })();
const SORTED = [...BH].sort((a, b) => a - b);
function catmull(pts, n) {        // pts [[x,y]] -> dense polyline
  const o = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let k = 0; k < n; k++) { const u = k / n, u2 = u * u, u3 = u2 * u;
      o.push([0, 1].map(d => .5 * (2 * p1[d] + (-p0[d] + p2[d]) * u + (2*p0[d] - 5*p1[d] + 4*p2[d] - p3[d]) * u2 + (-p0[d] + 3*p1[d] - 3*p2[d] + p3[d]) * u3))); }
  }
  o.push(pts[pts.length - 1]); return o;
}
const PROF = catmull([[BX[0] - 140, 0], ...BX.map((x, k) => [x, BH[k]]), [BX[NB-1] + 140, 0]], 12);
function prof(x) {
  if (x <= PROF[0][0] || x >= PROF[PROF.length - 1][0]) return 0;
  let lo = 0, hi = PROF.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (PROF[m][0] < x) lo = m; else hi = m; }
  const u = (x - PROF[lo][0]) / ((PROF[hi][0] - PROF[lo][0]) || 1); return lerp(PROF[lo][1], PROF[hi][1], u);
}
const FIT = catmull(SORTED.map((h, k) => [BX[k], LY - h]), 14);

/* ---------- bar 6: UI ---------- */
const BXL = CX - 560, BXR = CX + 560, IH = 124, CH = 470, CR = 30;
const cardH = t => lerp(IH, CH, spr(t, 10.5, 16));
const BTN = [BXR - 64, LY - 62];
const PX0 = BXL + 58, PX1 = PX0 + 520, PAY = LY - 86;
const AX = BXL + 650, AY = LY - 112;

/* ---------- bar 7: motif -> letter morphs ---------- */
const TRK = 30;
const letterX = (i, t) => titleX(i) + (i - 3.5) * TRK * (t >= 12 ? 1 - spr(t, 14.0, 13) : 0);
const ACC = [COB, VER, COB, VER, COB, VER, COB, VER];
const MOTIF = TT.chars.map((ch, i) => {
  if (ch === '_') return null;
  const [x0, y0, x1, y1] = G[ch].bb, w = x1 - x0, h = y1 - y0, mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  let A, order;
  if (ch === 'm') {                                    // the wave from bar 4
    const top = [], bot = [], amp = h * .3, th = 70;
    for (let k = 0; k <= 120; k++) { const x = x0 + w * k / 120, y = my + amp * Math.sin(k / 120 * Math.PI * 4); top.push([x, y - th]); bot.unshift([x, y + th]); }
    A = [poly([...top, ...bot])];
  } else if (ch === 'a' && i === 1) {                  // the triangle from bar 3
    A = [poly([[mx, y0 - 40], [x1 + 30, y1], [x0 - 30, y1]])];
  } else if (ch === 't') {                             // the + from bar 2
    const r = Math.max(w, h) * .5, k = 62;
    A = [poly([[mx - k, my - r], [mx + k, my - r], [mx + k, my - k], [mx + r, my - k], [mx + r, my + k], [mx + k, my + k], [mx + k, my + r], [mx - k, my + r], [mx - k, my + k], [mx - r, my + k], [mx - r, my - k], [mx - k, my - k]])];
  } else if (ch === 'h') {                             // the bars from bar 5
    const s = w / 3;
    A = [poly([[x0, y1], [x0, y1 - h * .42], [x0 + s, y1 - h * .42], [x0 + s, y0], [x0 + 2 * s, y0], [x0 + 2 * s, y1 - h * .7], [x1, y1 - h * .7], [x1, y1]])];
  } else if (ch === 'e') {                             // the ring from bar 1
    const r = Math.max(w, h) * .52;
    A = [circ(mx, my, r), reversed(circ(mx, my, r - 64))];
  } else if (ch === 'a') {                             // the star from bar 3
    const r = Math.max(w, h) * .62;
    A = [poly([...Array(10)].map((_, k) => { const a = (-90 + 36 * k) * deg, rr = k % 2 ? r * .45 : r; return [mx + Math.cos(a) * rr, my + 20 + Math.sin(a) * rr]; }))];
  } else if (ch === 'i') {                             // the data point + a stem from the line
    const cs = G.i.c.map(c => ({ c, cy: centroid(c)[1] })).sort((p, q) => p.cy - q.cy);
    const dot = cs[0].c; let dx0 = 1e9, dx1 = -1e9, dy0 = 1e9, dy1 = -1e9;
    for (let k = 0; k < dot.length; k += 2) { dx0 = Math.min(dx0, dot[k]); dx1 = Math.max(dx1, dot[k]); dy0 = Math.min(dy0, dot[k+1]); dy1 = Math.max(dy1, dot[k+1]); }
    const sc = (mx), sw = 14;
    A = [circ((dx0 + dx1) / 2, (dy0 + dy1) / 2, (dx1 - dx0) * .75), poly([[sc - sw, 0], [sc - sw, dy1 + 60], [sc + sw, dy1 + 60], [sc + sw, 0]])];
    order = 'y';
  }
  const bbc = [mx, my];
  return { M: prepMorph(A, G[ch].c.map(c => Float64Array.from(c)), { order }), c: bbc };
});
/* ring -> e (bar 2) and 0 -> disc (bar 3), in unit / glyph local coords */
const M_RING_E = prepMorph([circ(0, 0, RR / RC), reversed(circ(0, 0, (RC - RW / 2) / RC))], G.e.c.map(c => Float64Array.from(c)));
const M_ZERO_DISC = prepMorph(G['0'].c.map(c => Float64Array.from(c)), [circ(0, 0, 1)]);

/* ---------- drawing ---------- */
const view = document.getElementById('c'), vctx = view.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
const acc = document.createElement('canvas'); acc.width = W; acc.height = H;
const ctx = off.getContext('2d'), actx = acc.getContext('2d');

function clipAbove(y = LTOP) { ctx.beginPath(); ctx.rect(-10, -10, W + 20, y + 10); ctx.clip(); }
function clipBelow(y = LBOT) { ctx.beginPath(); ctx.rect(-10, y, W + 20, H - y + 10); ctx.clip(); }
function hline(x0, x1, y, th, col) { ctx.fillStyle = col; ctx.fillRect(x0, y - th / 2, x1 - x0, th); }
function text(s, x, y, size, wt, col, align = 'left') {
  ctx.font = `${Math.round(wt)} ${size}px G`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function font(size, wt) { ctx.font = `${Math.round(wt)} ${size}px G`; }

/* ruler ticks under the line: visible windows in [in, out] */
const RULER = [[.5, 6.0], [8.5, 10.0], [12.25, 14.0]];
function ruler(t, cx) {
  const k0 = Math.floor((cx - XR0 - 80) / TICK), k1 = Math.ceil((cx + W + 80 - XR0) / TICK);
  for (let k = k0; k <= k1; k++) {
    const sx = XR0 + k * TICK - cx; if (sx < -20 || sx > W + 20) continue;
    let v = 0;
    for (const [a, b] of RULER) {
      const din = a === .5 ? Math.abs(sx - RX0) / 5000 : Math.abs(sx - CX) / 6000, dout = sx / 9000;
      v = Math.max(v, eo(P(t, a + din, .22), 6) * (1 - ei(P(t, b + dout, .14), 5)));
    }
    if (v <= 0) continue;
    const major = ((k % 4) + 4) % 4 === 0;
    ctx.globalAlpha = major ? .8 : .42; ctx.fillStyle = PAPER;
    ctx.fillRect(sx - (major ? 1.5 : 1), LBOT + 8, major ? 3 : 2, (major ? 26 : 12) * v);
  }
  ctx.globalAlpha = 1;
}

/* letters of the title: sinking at the start, rising + morphing in bar 7, settled at the end */
function drawLetters(t) {
  if (t < .6) {                                   // hook: letters sink through the baseline
    ctx.save(); clipAbove(BY + UB[1] * TS);
    ctx.fillStyle = PAPER;
    TT.chars.forEach((ch, i) => { if (ch === '_') return;
      const dy = ei(P(t, .03 * Math.abs(i - 5) - .03, .34), 4) * FS * .95;
      ctx.fill(gPath(ch, titleX(i), BY + dy, TS)); });
    ctx.restore(); return;
  }
  if (t < 12) return;
  TT.chars.forEach((ch, i) => { if (ch === '_') return;
    const Ti = 12 + .25 * i; if (t < Ti) return;
    const rise = eo(P(t, Ti, .3), 6), dy = (1 - rise) * FS * .95;
    const sc = 1 + .28 * (1 - eo(P(t, Ti, .42), 5));
    const u = eo(P(t, Ti + .05, .36), 6);
    const col = t < Math.min(Ti + .25, 14) ? ACC[i] : PAPER;
    const m = MOTIF[i], gx = letterX(i, t), [mx, my] = m.c;
    const s = TS * sc, tx = gx + mx * TS - mx * s, ty = BY + dy + my * TS - my * s;
    ctx.save(); if (rise < 1) clipAbove();
    ctx.fillStyle = col;
    ctx.fill(u >= 1 && sc === 1 ? gPath(ch, gx, BY, TS) : morphPath(m.M, u, [s, tx, ty], [s, tx, ty]));
    ctx.restore();
  });
}

function bar1(t, cx) {
  if (t < .5 || t > 2.6) return;
  // ring travel: world-anchored while rolling, ignores the whip at 2.0
  const wcx = camNoWhip(t, 2);
  const th = ringTheta(t), rx = ringWorldX(t) - wcx;
  // unrolled circumference + cycloid trail (world, leaves with the whip)
  if (t >= 1.0) {
    const x0 = XR0 - cx, x1 = ringWorldX(t) - cx;
    hline(x0, x1, LY, RW, PAPER);
    ctx.beginPath();
    for (let k = 0; k <= 90; k++) { const a = th * k / 90, px = XR0 + RR * a - RC * Math.sin(a) - cx, py = RY + RC * Math.cos(a); k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.strokeStyle = PAPER; ctx.globalAlpha = .55; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
  }
  // labels 0..3 and the π marker (world), dropping out of the line
  if (t >= 1.5) {
    ctx.save(); clipBelow();
    for (let k = 0; k < 3; k++) { const v = eo(P(t, 1.5 + .05 * k, .24), 6);
